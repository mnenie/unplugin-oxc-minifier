name: release

on:
  workflow_run:
    workflows: [ci checks]
    types:
      - completed
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write
      id-token: write

    env:
      ALLOWED_USERS: ${{ secrets.ALLOWED_PUBLISHERS }}

    steps:
      - name: is allowed
        run: |
          ALLOWED_USERS="${{ secrets.ALLOWED_PUBLISHERS }}"
          if [[ ",${ALLOWED_USERS}," != *",${{ github.actor }},"* ]]; then
            echo "::error::${{ github.actor }}"
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --no-frozen-lockfile

      - name: check if version exists
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if npm view ${{ github.repository }}@VERSION version > /dev/null 2>&1; then
            echo "error=true" >> $GITHUB_OUTPUT
          else
            echo "error=false" >> $GITHUB_OUTPUT
          fi

      - name: tsdown build
        run: pnpm build

      - name: publish
        if: steps.check_version.outputs.error == 'false' && steps.tsdown_build.outputs.success == 'true' && !contains(github.event.head_commit.message, '[skip release]')
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: version exists
        if: steps.check_version.outputs.error == 'true'
        run: |
          echo "::error::please bump the version before releasing. "
          exit 1
