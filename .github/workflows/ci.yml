name: ci checks

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: tests
        run: pnpm test run

      - name: tsdown build
        run: pnpm build
